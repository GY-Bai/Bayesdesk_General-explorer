[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesdesk-general-explorer"
version = "0.2.0"
description = "Deterministic engineer-leader orchestration and resource-broker prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bayesdesk = "bayesdesk.cli:main"

[tool.setuptools.packages.find]
include = ["bayesdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
